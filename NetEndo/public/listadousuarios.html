<script>
    window.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('/sesion-activa');
        const data = await res.json();

        if (!data.loggedIn || data.role !== 'admin') {
            alert('Acceso no autorizado. Inicia sesión.');
            window.location.href = '/login.html';
        } else {
            cargarUsuarios();
        }
    });
</script>

<!DOCTYPE HTML>
<html lang=es>

<head>
    <meta charset="utf-8">
    <title> NetEndo </title>
    <meta name="autor" content="Catalina Pérez Vásquez">
    <meta name="descripción" content="Página web dedicada para venta de videojuegos online">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Share+Tech&display=swap"
        rel="stylesheet">
    <link rel="icon" type="icon" href="/images/NetEndoIcon.png">
</head>

<body style=" background-image: url('/images/background_mario.png')">
    <header>
        <div class="Logo">
            <img src="/images/NetEndo.png" width="100" height="100">
            <a href="/index.html">
                <h2>NetEndo</h2>
            </a>
        </div>
        <nav>
            <a href="/index.html" class="nav-link"> Inicio </a>
            <a href="/carrito.html" class="nav-link"> Carrito</a>
            <a href="/sobrenosotros.html" class="nav-link active"> Sobre Nosotros</a>
            <a href="/contactanos.html" class="nav-link">Contactanos</a>
            <a href="/login.html" class="nav-link" aria-current="page">Login</a>
        </nav>
    </header>
    <div class="inventario">
        <h1>Gestión de Usuarios</h1>

        <table border="1" style="width: 80%; margin: 0 auto; background-color: white; text-align: center;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios">
            </tbody>
        </table>
    </div>

    <script>
        // No quise eliminar por inactividad porque tendría que alterar mi tabla
        // y después cambiar el login con un query nueva y la vrd me dio flojera xd.
        async function cargarUsuarios() {
            try {
                const res = await fetch('/api/usuarios');
                const usuarios = await res.json();
                const tabla = document.getElementById('tabla-usuarios');
                tabla.innerHTML = '';

                usuarios.forEach(user => {
                    const fila = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.nombre}</td>
                            <td>${user.correo}</td>
                            <td>
                                <select onchange="cambiarRol(${user.id}, this.value)">
                                    <option value="usuario" ${user.role === 'usuario' ? 'selected' : ''}>usuario</option>
                                    <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>admin</option>
                                </select>
                            </td>
                            <td>
                                <button onclick="eliminarUsuario(${user.id})">Eliminar</button>
                            </td>
                        </tr>
                    `;
                    tabla.innerHTML += fila;
                });
            } catch (error) {
                console.error('Error al cargar usuarios:', error);
            }
        }

        async function cambiarRol(id, nuevoRol) {
            try {
                const res = await fetch(`/api/usuarios/${id}/rol`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: nuevoRol })
                });
                const data = await res.json();
                alert(data.mensaje || 'Rol actualizado');
            } catch (err) {
                console.error('Error al cambiar rol:', err);
            }
        }

        async function eliminarUsuario(id) {
            if (!confirm('Deseas eliminar este usuario?')) return;
            try {
                const res = await fetch(`/api/usuarios/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                alert(data.mensaje || 'Usuario eliminado');
                cargarUsuarios();
            } catch (err) {
                console.error('Error al eliminar usuario:', err);
            }
        }
    </script>
</body>

</html>

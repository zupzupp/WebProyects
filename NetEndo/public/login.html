<!DOCTYPE HTML>
<html lang=es>

<head>
    <meta charset="utf-8">
    <title> NetEndo </title>
    <meta name="autor" content="Catalina Pérez Vásquez">
    <meta name="descripción" content="Página web dedicada para venta de videojuegos online">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Share+Tech&display=swap"
        rel="stylesheet">
    <link rel="icon" type="icon" href="/images/NetEndoIcon.png">
</head>

<body style=" background-image: url('/images/background_mario.png')">
    <header>
        <div class="Logo">
            <img src="/images/NetEndo.png" width="100" height="100">
            <a href="/index.html"><h2>NetEndo</h2></a>
        </div>
        <nav>
            <a href="/index.html" class="nav-link"> Inicio </a>
            <a href="/carrito.html" class="nav-link"> Carrito</a>
            <a href="/sobrenosotros.html" class="nav-link active"> Sobre Nosotros</a>
            <a href="/contactanos.html" class="nav-link">Contactanos</a>
            <a href="/login.html" class="nav-link" aria-current="page">Login</a>
        </nav>
    </header>
    <div class="login">
    <div class="login-container">
        <div class="banner-vert">
            <img src="/images/mariologin.jpeg">
        </div>
        <div class="form-section">
            <h2>Inicia sesión en NetEndo</h2>
            <form id = "formLogin">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" placeholder="correo.electronico@gmail.com" required minlength="6">
    
                <label for="passwd">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
    
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
    
                <button type="submit">Inicia sesión</button>

    
                <p class="register">¿Eres nuevo? <a href="/registro.html">Regístrate</a></p>
            </form>
        </div>
    </div>
</div>

<script>
    // Verifica si ya hay una sesión activa al cargar la página
    window.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('/sesion-activa');
        const data = await res.json();

        if (data.loggedIn) {
            // Redirige automáticamente según el rol
            if (data.role === 'admin') {
                window.location.href = '/menuadmin.html';
            } else {
                window.location.href = '/cuenta.html';
            }
        }
    });

    document.getElementById('formLogin').addEventListener('submit', async function (e) {
        e.preventDefault();

        const correo = document.getElementById('correo').value;
        const contrasena = document.getElementById('password').value;

        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, contrasena })
        });

        const data = await res.json();

        if (data.success) {
            window.location.href = data.redirect;
        } else {
            alert(data.message || 'Error al iniciar sesión');
        }
    });
</script>

</body>



</html>

<!DOCTYPE HTML>
<html lang=es>

<head>
    <meta charset="utf-8">
    <title> NetEndo </title>
    <meta name="autor" content="Catalina Pérez Vásquez">
    <meta name="descripción" content="Página web dedicada para venta de videojuegos online">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link rel="stylesheet" href="/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Share+Tech&display=swap"
        rel="stylesheet">
    <link rel="icon" type="icon" href="/images/NetEndoIcon.png">
</head>

<body style=" background-image: url('/images/background_mario.png')">
    <header>
        <div class="Logo">
            <img src="/images/NetEndo.png" width="100" height="100">
            <a href="/index.html"><h2>NetEndo</h2></a>
        </div>
        <nav>
            <a href="/index.html" class="nav-link"> Inicio </a>
            <a href="/carrito.html" class="nav-link"> Carrito</a>
            <a href="/sobrenosotros.html" class="nav-link active"> Sobre Nosotros</a>
            <a href="/contactanos.html" class="nav-link">Contactanos</a>
            <a href="/login.html" class="nav-link" aria-current="page">Login</a>
        </nav>
    </header>
    <div class="login">
    <div class="login-container">
        <div class="banner-vert">
            <img src="/images/mariologin.jpeg">
        </div>

    <div class="form-section">
        <h2>Regístrate</h2>
        <form id="formRegistro">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="contrasena" placeholder="********" required minlength="6">

            <button type="submit">Crear cuenta</button>

            <p class="register">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p> </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('formRegistro').addEventListener('submit', async function (e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const contrasena = document.getElementById('contrasena').value;
        const role = 'usuario';

        const res = await fetch('/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, correo, contrasena, role })
        });

        const data = await res.json();

        if (data.success) {
            alert('Registro exitoso. Puedes iniciar sesión.');
            window.location.href = '/login.html';
        } else {
            alert(data.message || 'Error en el registro');
        }
    });
</script>
</body>

</html>
